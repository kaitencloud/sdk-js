name: Update visual baselines

# Manually-triggered regeneration of the Playwright visual-regression baselines
# (packages/react-ui/tests/visual/__screenshots__/*-linux.png).
#
# Why this exists: the baselines are rendering-environment-sensitive (sub-pixel
# anti-aliasing differs by CPU arch, OS, and font stack). GitHub's runners are
# amd64 Linux, so the only reliable way to produce matching baselines is to
# render them inside the SAME Playwright image the `test` job in ci.yml
# uses. Generating them on a developer's arm64 macOS machine never matches CI.
#
# What it does, in two jobs:
#   render (read-only token, no credential on disk):
#     1. Builds the workspace packages + the static Storybook (exactly like CI).
#     2. Runs `playwright test --update-snapshots`, rewriting the *-linux.png.
#     3. Re-runs the suite WITHOUT --update to prove the fresh baselines pass in
#        this environment (this is the "verified green in CI" gate).
#     4. Uploads them as an artifact, which is also the fallback if the push
#        below is rejected (e.g. a protected branch).
#   commit (the one job that can write):
#     5. Commits those baselines to the branch you dispatched from and pushes.
#
# Why two jobs: rendering installs the dependency tree and runs its install
# scripts, its build and Storybook. None of that runs where a token that can push
# exists, so a compromised dependency cannot write to the repository. The job that
# holds that token installs nothing and runs no code from the branch.
#
# Usage:
#   Actions tab -> "Update visual baselines" -> Run workflow -> pick the branch.
#   or:  gh workflow run update-visual-baselines.yml --ref <branch>

on:
  workflow_dispatch:

permissions: {}

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same image as the `test` job in ci.yml so the rendered pixels match.
    # Keep the tag in sync with the pinned @playwright/test version;
    # scripts/check-version-invariants.mjs fails when they differ.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The commit the workflow was dispatched on. `commit` checks out the
          # same one, so the baselines land on the code they were rendered from.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          # actions/setup-node and pnpm/action-setup own Node.js and pnpm. Vite+
          # only provides vp, at the catalog's vite-plus version.
          node-manager: false
          package-manager: false
          cache: true
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: vp run -r build
      - name: Link preinstalled Playwright browsers into the default cache path
        # Same shim as ci.yml: the test scripts run with
        # `env -u PLAYWRIGHT_BROWSERS_PATH`, so Playwright looks in its default
        # cache (~/.cache/ms-playwright). Symlink that to the image's browsers.
        run: |
          for home in "$HOME" /root; do
            mkdir -p "$home/.cache"
            ln -sfn /ms-playwright "$home/.cache/ms-playwright"
          done
      - name: Build React Storybook
        working-directory: packages/react-ui
        run: vp run build-storybook
      - name: Regenerate Linux visual baselines
        working-directory: packages/react-ui
        run: vp run test:visual:update
      - name: Verify the regenerated baselines pass
        # No --update here: this re-runs the suite against the freshly written
        # baselines and fails if anything is still off. A green run is proof the
        # committed baselines match this (amd64 Linux) environment.
        working-directory: packages/react-ui
        run: vp run test:visual
      - name: Upload regenerated baselines as an artifact
        # Always upload, so the baselines can be downloaded and committed by hand
        # if the push in `commit` is rejected (e.g. a protected branch). `commit`
        # only runs when this whole job, verification included, succeeded.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: visual-baselines-linux
          path: packages/react-ui/tests/visual/__screenshots__/*-linux.png
          retention-days: 14
          if-no-files-found: warn

  commit:
    needs: render
    runs-on: ubuntu-latest
    # Needed to push the regenerated baselines back to the branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The commit `render` rendered from. If the branch has moved since, the
          # push below is not a fast-forward and fails rather than landing the
          # baselines on code they were not rendered from. persist-credentials
          # (default) keeps the token configured so that push is authenticated.
          ref: ${{ github.sha }}
      - name: Download the verified baselines
        uses: actions/download-artifact@v8.0.1
        with:
          name: visual-baselines-linux
          path: ${{ runner.temp }}/visual-baselines-linux
      - name: Commit updated baselines back to the branch
        run: |
          set -euo pipefail
          baselines="packages/react-ui/tests/visual/__screenshots__"
          # Only the Linux PNGs, flat, into the one directory this workflow owns:
          # the artifact came from a job that ran the dependency tree.
          find "$RUNNER_TEMP/visual-baselines-linux" -maxdepth 1 -type f -name '*-linux.png' \
            -exec cp -- {} "$baselines/" \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$baselines"
          if git diff --cached --quiet; then
            echo "Baselines already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "test(react-ui): regenerate Linux visual baselines in CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
