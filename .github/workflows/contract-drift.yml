name: Contract drift

# Compares the committed contract snapshots with what the Kaiten API publishes:
#
#   openapi   contracts/openapi.yaml    vs  @kaitencloud/openapi@latest
#   graphql   contracts/schema.graphql  vs  @kaitencloud/graphql-schema@latest
#
# By default both public contracts come from npm, with no token (forks work too).
# Only the feature PR named in .github/kaiten-contract-source.json may instead
# compare with a full, immutable kaitencloud/kaiten SHA. Main, scheduled checks
# and other PR branches always compare with npm latest. See CONTRIBUTING.md.
# Both contracts are required: failed fetches and real drift fail their jobs.
#
# The GraphQL schema is published as the concatenation of the API's schema
# fragments, not as a printed SDL: printCanonicalSchema in
# scripts/graphql-schema-source.mjs stays the single definition of the canonical
# form, so the byte-equality diff cannot flake on two printers disagreeing.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, to catch a contract published between two pushes.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Select published or pinned companion contract source
        id: source
        run: node scripts/contract-ci-source.mjs
      - name: Fetch immutable companion contract blobs (no checkout or execution)
        if: steps.source.outputs.commit != ''
        id: companion
        env:
          CONTRACT_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          git init --bare "$dir/repo.git"
          git --git-dir="$dir/repo.git" remote add origin https://github.com/kaitencloud/kaiten.git
          git --git-dir="$dir/repo.git" fetch --depth=1 --filter=blob:none origin "$CONTRACT_COMMIT"
          node scripts/prepare-companion-contracts.mjs "$dir/repo.git" "$CONTRACT_COMMIT" "$dir"
      - name: Fetch the published contract (@kaitencloud/openapi@latest)
        if: steps.source.outputs.commit == ''
        id: contract
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          npm pack @kaitencloud/openapi@latest --pack-destination "$dir"
          tar -xzf "$dir"/*.tgz -C "$dir"
          echo "spec=$dir/package/openapi.yaml" >> "$GITHUB_OUTPUT"
      - name: Compare the snapshot with the selected upstream contract
        env:
          KAITEN_OPENAPI: ${{ steps.companion.outputs.spec || steps.contract.outputs.spec }}
        run: node scripts/check-openapi-drift.mjs

  graphql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        # The drift script parses the operations and builds the schema with graphql.
        run: pnpm install --frozen-lockfile
      - name: Select published or pinned companion contract source
        id: source
        run: node scripts/contract-ci-source.mjs
      - name: Fetch immutable companion contract blobs (no checkout or execution)
        if: steps.source.outputs.commit != ''
        id: companion
        env:
          CONTRACT_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          git init --bare "$dir/repo.git"
          git --git-dir="$dir/repo.git" remote add origin https://github.com/kaitencloud/kaiten.git
          git --git-dir="$dir/repo.git" fetch --depth=1 --filter=blob:none origin "$CONTRACT_COMMIT"
          node scripts/prepare-companion-contracts.mjs "$dir/repo.git" "$CONTRACT_COMMIT" "$dir"
      - name: Fetch the published schema (@kaitencloud/graphql-schema@latest)
        if: steps.source.outputs.commit == ''
        id: contract
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          npm pack @kaitencloud/graphql-schema@latest --pack-destination "$dir"
          tar -xzf "$dir"/*.tgz -C "$dir"
          echo "schema=$dir/package/schema.graphqls" >> "$GITHUB_OUTPUT"
      - name: Compare schema AND validate shipped operations against the selected upstream
        env:
          KAITEN_GRAPHQL_SCHEMA: ${{ steps.companion.outputs.schema || steps.contract.outputs.schema }}
        run: node scripts/check-graphql-drift.mjs
